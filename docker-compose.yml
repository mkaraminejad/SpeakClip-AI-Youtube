services:
  speakclip-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakclip-ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # Allows container to reach host services like local Ollama (http://host.docker.internal:11434)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
